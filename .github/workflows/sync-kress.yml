name: Daily Kress price sync

on:
  schedule:
    - cron: '0 11 * * *'   # every day at 11:00 UTC (6 AM Central)
  workflow_dispatch:        # adds a "Run workflow" button for manual updates

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download latest Kress models and prices
        run: node scripts/sync-kress.js
      - name: Save changes
        run: |
          git config user.name "kress-sync-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/robots.json
          git diff --cached --quiet || git commit -m "Daily Kress price sync"
          git push
